[workspace]
members = [
    "vela-core",
    "protocols/vela-request",
    "protocols/vela-connect",
    "protocols/vela-broadcast",
    "protocols/vela-table",

    # 打包所有Crate
    "vela",

    #Demo
    "examples/vela-gateway",
]
resolver = "3"

[workspace.package]
rust-version = "1.88.0"
edition = "2024"

[workspace.dependencies]
volans = { version = "0.2.0-beta", path = "../volans/volans" }
prost = "0.14.1"
futures = "0.3.31"
thiserror = "2.0"
tracing = "0.1"
tokio = "1.47"
prost-types = "0.14.1"
asynchronous-codec = "0.7.0"

vela-core = { path = "vela-core" }

# protocols
vela-request = { path = "protocols/vela-request", version = "0.1.0" }
vela-connect = { path = "protocols/vela-connect", version = "0.1.0" }
vela-broadcast = { path = "protocols/vela-broadcast", version = "0.1.0" }
vela-table = { path = "protocols/vela-table", version = "0.1.0" }
